<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Morbo</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="score" aria-live="polite">
    <span title="Eggs in basket">🥚 <b id="egg-count">0</b></span>
    <span title="Score">★ <b id="points">0</b></span>
    <span title="Time of day" id="clock">☀ 08:00</span>
  </div>
  <div id="lang" role="group"></div>
  <div id="speech" hidden></div>
  <div id="danger" role="alert" hidden></div>
  <div id="start" role="dialog" aria-modal="true" aria-labelledby="start-title" hidden>
    <div class="panel">
      <h1 id="start-title"></h1>
      <div class="cards"></div>
      <p class="note"></p>
    </div>
  </div>
  <div id="game-over" role="dialog" aria-modal="true" hidden>
    <div class="panel">
      <h1></h1>
      <p class="text"></p>
      <p class="stats"></p>
      <button type="button" onclick="location.reload()"></button>
    </div>
  </div>
  <div id="prompt" hidden></div>
  <div id="stick" hidden><div class="knob"></div></div>
  <button id="give-button" class="touch-button" type="button" hidden>🥚</button>
  <button id="time-button" class="touch-button" type="button">⏩</button>
  <div id="hud">loading terrain…</div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
